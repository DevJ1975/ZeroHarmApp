<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{% block description %}{% endblock %}">
<title>{% block title %}{% endblock %} | Zero Harm</title>
<style>
  :root { --bg:#f4f5f6; --surface:#fcfcfb; --text:#0b0b0b; --text2:#52514e; --rule:#dcdedf; --accent:#F5C400; --link:#17212B; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --surface:#1a1a19; --text:#f0efec; --text2:#c3c2b7; --rule:#34353a; --link:#f0efec; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:40px 16px 56px; overflow-wrap:break-word; }
  .band { display:inline-block; background:var(--accent); color:#17212B; font-weight:800; font-size:14px; letter-spacing:.04em; padding:4px 10px; border-radius:4px; }
  h1 { font-size:32px; line-height:1.15; margin:16px 0 8px; }
  h2 { font-size:22px; line-height:1.25; margin:36px 0 8px; padding-top:20px; border-top:1px solid var(--rule); }
  h3 { font-size:18px; line-height:1.3; margin:24px 0 6px; }
  p, li { color:var(--text2); }
  p { margin:0 0 14px; }
  ul { margin:0 0 14px; padding-left:22px; }
  li { margin:0 0 8px; }
  strong { color:var(--text); }
  a { color:var(--link); font-weight:600; text-underline-offset:3px; }
  a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .dates { margin:0 0 4px; font-size:15px; color:var(--text2); }
  .card { background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; margin:20px 0; }
  .card p:last-child, .card ul:last-child { margin-bottom:0; }
  nav.toc ul { list-style:none; padding:0; margin:0; columns:2 220px; column-gap:16px; }
  nav.toc li { margin:0 0 6px; break-inside:avoid; }
  nav.toc a { font-weight:500; }
  footer { margin-top:40px; padding-top:20px; border-top:1px solid var(--rule); font-size:15px; color:var(--text2); }
</style>
</head>
<body>
<main>
  <span class="band">ZERO HARM</span>
  <h1>{% block heading %}{% endblock %}</h1>
  <p class="dates"><strong>Effective date:</strong> {{ effective_date }}</p>
  <p class="dates"><strong>Last updated:</strong> {{ last_updated }}</p>
  {% block content %}{% endblock %}
  <footer>
    <p>{{ company }}, Las Vegas, Nevada. Questions: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>
    <p><a href="/privacy/">Privacy policy</a> &nbsp;·&nbsp; <a href="/terms/">Terms of use</a></p>
  </footer>
</main>
</body>
</html>
